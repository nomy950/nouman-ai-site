<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dropzone: Battle Royale</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
body.ingame #hud{display:block}
.sh{text-shadow:0 1px 3px rgba(0,0,0,.8)}
#topL{position:absolute;left:12px;top:10px;font-weight:700;line-height:1.05}
#topL .n{font-size:24px}#topL small{font-size:12px;opacity:.75;letter-spacing:1px;margin-left:3px}
#zoneTxt{margin-top:6px;font-size:13px;letter-spacing:1px;color:#cfe3ff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px;display:inline-block}
#zoneTxt.warn{color:#fff;background:rgba(40,110,255,.55)}
#compass{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(52vw,360px);height:26px;overflow:hidden;background:linear-gradient(90deg,transparent,rgba(0,0,0,.35) 20%,rgba(0,0,0,.35) 80%,transparent);font-weight:700;font-size:13px}
#compass .strip{position:absolute;top:4px;left:50%;white-space:nowrap}
#compass .strip span{position:absolute;transform:translateX(-50%);width:30px;text-align:center;opacity:.85}
#compass .strip span.c{color:#ffd24a;opacity:1;font-size:15px;top:-1px}
#compass:after{content:'';position:absolute;left:50%;bottom:0;border:5px solid transparent;border-bottom-color:#fff;transform:translateX(-50%)}
#mapWrap{position:absolute;right:10px;top:10px;width:128px;height:128px;border:2px solid rgba(255,255,255,.55);border-radius:6px;overflow:hidden;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:all .25s}
#mapWrap.big{width:min(86vmin,560px);height:min(86vmin,560px);right:50%;top:50%;transform:translate(50%,-50%);z-index:30}
#map{width:100%;height:100%;display:block}
#mapWrap{background-size:100% 100%;background-color:#2a6a8a}
#feed{position:absolute;right:12px;top:146px;text-align:right;font-size:13px;font-weight:600}
#feed div{background:rgba(0,0,0,.35);padding:2px 8px;margin-bottom:3px;border-radius:3px;transition:opacity .6s}
#feed .me{color:#ffd24a}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross i:nth-child(1),#cross i:nth-child(2){width:2px;height:8px;left:-1px}
#cross i:nth-child(3),#cross i:nth-child(4){height:2px;width:8px;top:-1px}
#cross b{position:absolute;width:3px;height:3px;left:-1.5px;top:-1.5px;background:#fff;border-radius:50%}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hitm:before,#hitm:after{content:'';position:absolute;background:#fff;left:50%;top:50%}
#hitm:before{width:2px;height:26px;transform:translate(-50%,-50%);background:linear-gradient(#fff 35%,transparent 35% 65%,#fff 65%)}
#hitm:after{height:2px;width:26px;transform:translate(-50%,-50%);background:linear-gradient(90deg,#fff 35%,transparent 35% 65%,#fff 65%)}
#hitm.kill:before{background:linear-gradient(#ff3b3b 35%,transparent 35% 65%,#ff3b3b 65%)}
#hitm.kill:after{background:linear-gradient(90deg,#ff3b3b 35%,transparent 35% 65%,#ff3b3b 65%)}
#bottom{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(60vw,420px);text-align:center}
#slots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.slot{pointer-events:auto;min-width:118px;padding:4px 10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);border-radius:4px;font-weight:700;font-size:13px;text-align:left;opacity:.6}
.slot.on{opacity:1;border-color:#ffd24a;background:rgba(0,0,0,.55)}
.slot .am{float:right;margin-left:8px}
.slot .am b{font-size:16px}
.bar{height:7px;background:rgba(0,0,0,.45);border-radius:2px;overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.15)}
.bar i{display:block;height:100%;transform-origin:left;transition:transform .15s}
#hpBar i{background:linear-gradient(90deg,#e8e8e8,#fff)}
#hpBar.low i{background:#ff4040}
#arBar i{background:#4aa8ff}
#meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:3px;opacity:.85}
#pickTip{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:4px;font-weight:700;font-size:15px;display:none;border-left:3px solid #ffd24a}
#center{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:22px;font-weight:700;letter-spacing:2px;text-align:center}
#prog{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:160px;display:none;text-align:center;font-weight:700;font-size:13px}
#prog .bar i{background:#5eff8a}
#dmgDir{position:absolute;left:50%;top:50%;width:0;height:0}
#dmgDir div{position:absolute;left:-60px;top:-150px;width:120px;height:40px;border-top:5px solid rgba(255,40,40,.9);border-radius:50% 50% 0 0;transform-origin:60px 150px;opacity:0;transition:opacity .8s}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.65) 100%);opacity:0;transition:opacity .4s}
#zoneTint{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(40,90,255,.08),rgba(40,90,255,.45));opacity:0;transition:opacity .5s}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent min(34vh,34vw),#000 calc(min(34vh,34vw) + 2px))}
#scope:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.85)}
#scope:after{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,.85)}
#reddot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 6px #f00;display:none}
/* touch */
#touch{position:fixed;inset:0;z-index:4;display:none}
body.touch.ingame #touch{display:block}
.tb{position:absolute;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;letter-spacing:1px;color:#fff;touch-action:none}
.tb.act{background:rgba(255,255,255,.35)}
#bFire{right:4vw;bottom:16vh;width:88px;height:88px;font-size:14px;background:rgba(200,40,40,.3)}
#bFire2{left:4vw;top:32vh;width:62px;height:62px;background:rgba(200,40,40,.3)}
#bAim{right:calc(4vw + 100px);bottom:30vh;width:58px;height:58px}
#bJump{right:calc(4vw + 6px);bottom:calc(16vh + 104px);width:52px;height:52px}
#bReload{right:calc(4vw + 100px);bottom:calc(30vh + 70px);width:50px;height:50px}
#bHeal{right:calc(4vw + 170px);bottom:16vh;width:50px;height:50px}
#bPick{right:calc(4vw + 110px);bottom:12vh;width:auto;height:40px;border-radius:20px;padding:0 14px;display:none;background:rgba(255,190,40,.35);border-color:#ffd24a}
#bDeploy{left:50%;bottom:14vh;transform:translateX(-50%);width:120px;height:120px;font-size:20px;display:none;background:rgba(255,190,40,.35);border-color:#ffd24a}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);display:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.55)}
#joyHint{position:absolute;left:6vw;bottom:14vh;width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.2)}
/* screens */
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.7))}
.scr.hide{display:none}
.logo{font-size:clamp(46px,12vw,110px);font-weight:700;letter-spacing:6px;line-height:.9;color:#ffd24a;text-shadow:0 4px 0 #8a5a00,0 8px 30px rgba(0,0,0,.6)}
.tag{margin-top:10px;font-size:14px;letter-spacing:6px;opacity:.9}
.btn{pointer-events:auto;margin-top:26px;font-family:inherit;font-weight:700;font-size:20px;letter-spacing:4px;padding:12px 44px;color:#1a1200;background:linear-gradient(#ffe27a,#ffbf1a);border:none;border-radius:4px;box-shadow:0 4px 0 #9a6a00,0 10px 30px rgba(0,0,0,.5);cursor:pointer}
.btn:active{transform:translateY(2px)}
.help{margin-top:22px;font-size:13px;line-height:1.7;opacity:.85;max-width:560px}
.help b{color:#ffd24a}
.big{font-size:clamp(34px,8vw,72px);font-weight:700;letter-spacing:3px}
.win{color:#ffd24a;text-shadow:0 4px 0 #8a5a00}
.res{margin-top:14px;display:flex;gap:28px;font-size:15px;opacity:.95}
.res b{display:block;font-size:30px}
#rot{margin-top:12px;font-size:12px;opacity:.7;display:none}
body.touch #rot{display:block}
@media (orientation:landscape){#rot{display:none!important}}
#load{position:fixed;inset:0;z-index:40;background:#0b0d10;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:5px;color:#ffd24a}
</style>

<body>
<canvas id="gl"></canvas>

  <div id="compass"><div class="strip" id="cstrip"></div></div>
  <div id="mapWrap"><svg id="map" viewBox="0 0 320 320"><defs><mask id="zm"><rect width="320" height="320" fill="#fff"/><circle id="zmc" fill="#000" r="0"/></mask></defs><rect width="320" height="320" fill="rgba(40,80,230,.38)" mask="url(#zm)"/><circle id="zc" fill="none" stroke="#4a8aff" stroke-width="2.5" r="0"/><circle id="nc" fill="none" stroke="#fff" stroke-width="1.8" r="0"/><line id="pl" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-dasharray="6 5"/><g id="pings"></g><path id="me" d="M0,-9 L6,6 L0,2 L-6,6Z" fill="#ffd24a" stroke="#000" stroke-width="1.5"/></svg></div>

  <div id="bottom">
    <div id="slots"><div class="slot" data-i="0"></div><div class="slot" data-i="1"></div></div>
    <div class="bar" id="arBar"><i></i></div>
    <div class="bar" id="hpBar"><i></i></div>
    <div id="meta"><span id="hpTxt">100</span><span id="medTxt">MEDKITS 0</span><span id="ammoTxt"></span></div>
  </div>
</div>
<div id="touch">
  <div id="joyHint"></div>
  <div id="joy"><i></i></div>
  <div class="tb" id="bFire">FIRE</div>
  <div class="tb" id="bFire2">FIRE</div>
  <div class="tb" id="bAim">AIM</div>
  <div class="tb" id="bJump">JUMP</div>
  <div class="tb" id="bReload">R</div>

</div>
<div class="scr" id="menu">
  <div class="logo">DROPZONE</div>
  <div class="tag">BATTLE ROYALE · 25 PLAYERS · ONE SURVIVOR</div>

</div>

  <button class="btn" id="again">PLAY AGAIN</button>
</div>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (isTouch) document.body.classList.add('touch');
document.getElementById('help').innerHTML = isTouch
  ? '<b>LEFT THUMB</b> move · <b>RIGHT THUMB</b> drag to look · <b>FIRE</b> shoot (drag it to aim while firing)<br><b>AIM</b> scope · <b>R</b> reload · <b>+</b> medkit · tap <b>MAP</b> to enlarge<br>Jump from the plane, loot houses, stay inside the zone, be the last one standing.'
  : '<b>WASD</b> move · <b>SHIFT</b> sprint · <b>MOUSE</b> look · <b>LMB</b> fire · <b>RMB</b> aim<br><b>SPACE</b> jump · <b>E</b> pick up · <b>R</b> reload · <b>1/2</b> weapons · <b>H</b> medkit · <b>M</b> map<br>Jump from the plane, loot houses, stay inside the zone, be the last one standing.';

// ================= utils =================
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const SEED = (Math.random() * 1e6) | 0;
function hash2(x, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ Math.imul(SEED, 144665); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function vnoise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf); const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, z, o = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += vnoise(x * f, z * f) * a; n += a; a *= 0.5; f *= 2.03; } return s / n; }
function col(geo, hex) { const c = new THREE.Color(hex), n = geo.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; } geo.setAttribute('color', new THREE.BufferAttribute(a, 3)); return geo; }
function part(geo, hex, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) { if (rx) geo.rotateX(rx); if (ry) geo.rotateY(ry); if (rz) geo.rotateZ(rz); geo.translate(x, y, z); return col(geo, hex); }
const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cyl = (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s);

// ================= renderer / scene =================
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: 'high-performance' });
let PR = Math.min(devicePixelRatio || 1, isTouch ? 1.5 : 1.75);
renderer.setPixelRatio(PR); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOGC = new THREE.Color(0xb9cddd);
scene.fog = new THREE.FogExp2(FOGC, 0.0019);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 3200);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// sky
const sky = new Sky(); sky.scale.setScalar(2800);
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 32), THREE.MathUtils.degToRad(145));
Object.assign(sky.material.uniforms, {});
sky.material.uniforms.turbidity.value = 5; sky.material.uniforms.rayleigh.value = 1.4;
sky.material.uniforms.mieCoefficient.value = 0.004; sky.material.uniforms.mieDirectionalG.value = 0.82;
sky.material.uniforms.sunPosition.value.copy(sunDir);
scene.add(sky);
{
  const pm = new THREE.PMREMGenerator(renderer);
  const s2 = new THREE.Scene(); const sk2 = new Sky(); sk2.scale.setScalar(100); sk2.material = sky.material; s2.add(sk2);
  scene.environment = pm.fromScene(s2, 0).texture; pm.dispose();
}
const hemi = new THREE.HemisphereLight(0xcfe2ff, 0x5a4a30, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
const SC = 45; Object.assign(sun.shadow.camera, { left: -SC, right: SC, top: SC, bottom: -SC, near: 1, far: 400 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ================= terrain =================
const WORLD = 840, SEG = 168, N = SEG + 1, CELL = WORLD / SEG, HALF = WORLD / 2, ISLAND = 360;
const H = new Float32Array(N * N);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  const x = -HALF + i * CELL, z = -HALF + j * CELL;
  const r = Math.hypot(x, z) / ISLAND + (vnoise(x * 0.008 + 50, z * 0.008) - 0.5) * 0.35;
  const mask = 1 - sstep(0.62, 1.0, r);
  const n = fbm(x * 0.0045, z * 0.0045);
  const ridge = 1 - Math.abs(fbm(x * 0.006 + 99, z * 0.006 - 31, 4) * 2 - 1);
  let h = 3 + Math.pow(n, 2.0) * 55 + Math.pow(ridge, 4) * 22 * sstep(0.4, 0.7, n);
  h = h * mask - (1 - mask) * 14;
  H[j * N + i] = h;
}
function terrainH(x, z) {
  const fx = (x + HALF) / CELL, fz = (z + HALF) / CELL, i = Math.floor(fx), j = Math.floor(fz);
  if (i < 0 || j < 0 || i >= SEG || j >= SEG) return -14;
  const u = fx - i, v = fz - j;
  const a = H[j * N + i], b = H[(j + 1) * N + i], c = H[(j + 1) * N + i + 1], d = H[j * N + i + 1];
  return u + v <= 1 ? a + (d - a) * u + (b - a) * v : c + (b - c) * (1 - u) + (d - c) * (1 - v);
}
function landPoint(maxR = 320, minH = 2.5, maxH = 45, tries = 60) {
  for (let k = 0; k < tries; k++) { const a = R(0, Math.PI * 2), r = Math.sqrt(Math.random()) * maxR; const x = Math.cos(a) * r, z = Math.sin(a) * r; const h = terrainH(x, z); if (h > minH && h < maxH) return new THREE.Vector3(x, h, z); }
  return new THREE.Vector3(0, terrainH(0, 0), 0);
}

// ================= structures (houses + containers) =================
const structures = []; // {cx,cz,rad,walls:[box], floor:{minX,maxX,minZ,maxZ,y}|null, house}
const houseGeos = [];
function flatten(cx, cz, hw, hd, y) {
  const m = 7;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = -HALF + i * CELL, z = -HALF + j * CELL;
    const dx = Math.max(0, Math.abs(x - cx) - hw - 1), dz = Math.max(0, Math.abs(z - cz) - hd - 1);
    const d = Math.hypot(dx, dz); if (d > m) continue;
    const w = 1 - sstep(0, m, d);
    H[j * N + i] = lerp(H[j * N + i], y, w);
  }
}
function overlaps(cx, cz, rad) { return structures.some(s => Math.hypot(s.cx - cx, s.cz - cz) < s.rad + rad + 3); }
function boxGeo(b, hex) { const g = Box(b.maxX - b.minX, b.maxY - b.minY, b.maxZ - b.minZ); g.translate((b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2, (b.minZ + b.maxZ) / 2); return col(g, hex); }

  if (b.healT > 0) { b.healT -= dt; spd *= 0.4; if (b.healT <= 0) { b.meds--; b.health = Math.min(100, b.health + 75); } }
  b.vel.x = damp(b.vel.x, mx * spd, 8, dt); b.vel.z = damp(b.vel.z, mz * spd, 8, dt);
  p.x += b.vel.x * dt; p.z += b.vel.z * dt;

  p.y = damp(p.y, g, 20, dt); if (Math.abs(p.y - g) > 1.5) p.y = g;
  // stuck detection
  b.stuckT += dt; if (b.stuckT > 1.6) { if ((mx || mz) && b.lastPos.distanceTo(p) < 1.0) { b.goal = null; b.goalZone = false; b.goalLoot = null; const a = Math.atan2(mz, mx) + (Math.random() < 0.5 ? 1.6 : -1.6); b.goal = new THREE.Vector3(p.x + Math.cos(a) * 10, 0, p.z + Math.sin(a) * 10); b.unstick = 1.2; } b.lastPos.copy(p); b.stuckT = 0; }

    if (b.mag <= 0) { b.reloadT = W[b.weapon].reload * 1.2; return; }
    const w = W[b.weapon], tp = b.target.root.position;
    const eye = _eye(b, 1.5);

    const err = (0.03 + dist * 0.0007 + tv * 0.006 + b.moveAmt * 0.012) / b.skill + (w.pellets > 1 ? 0 : 0);

}
function fireBot(b, eye, d) {
  const w = W[b.weapon];
  if (w.pellets > 1) {
    const key = b.weapon;
    for (let k = 0; k < w.pellets; k++) { const dd = d.clone(); dd.x += R(-w.spread, w.spread); dd.y += R(-w.spread, w.spread); dd.z += R(-w.spread, w.spread); dd.normalize(); const res = castShot(eye, dd, w.range, b); tracer(muzzleWorld(b, key), res.point); if (res.who) damage(res.who, w.dmg * (res.who.isPlayer ? 0.62 : 0.9), b, res.head, key); }

    const dist = b.root.position.distanceTo(camera.position); if (dist < 260) shotSound(key, 1 / (1 + (dist / 35) ** 2), 0);

}
const _eyeV = new THREE.Vector3();
function _eye(s, h = 1.55) { return new THREE.Vector3(s.root.position.x, s.root.position.y + h, s.root.position.z); }

// ================= camera =================
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function updCamera(dt) {
  const s = player;
  camDir.set(-Math.sin(s.yaw) * Math.cos(s.pitch), Math.sin(s.pitch), -Math.cos(s.yaw) * Math.cos(s.pitch));
  camRight.set(Math.cos(s.yaw), 0, -Math.sin(s.yaw));
  let fov = 70;
  if (s.state === 'plane') {
    const piv = plane.pos; camPos.copy(piv).addScaledVector(camDir, -55); camPos.y += 8;
    camera.position.lerp(camPos, 1 - Math.exp(-dt * 6)); camera.lookAt(piv);
  } else if (s.state === 'fall' || s.state === 'chute' || (!s.alive)) {
    const piv = s.root.position.clone(); piv.y += s.state === 'chute' ? 2.5 : 1;
    const D = s.state === 'chute' ? 9 : s.alive ? 6 : 7;
    camPos.copy(piv).addScaledVector(camDir, -D);
    const gh = terrainH(camPos.x, camPos.z) + 0.5; if (camPos.y < gh) camPos.y = gh;
    camera.position.lerp(camPos, 1 - Math.exp(-dt * 10)); camera.lookAt(piv.addScaledVector(camDir, 2));
  } else {
    G.aimK = damp(G.aimK, G.aim ? 1 : 0, 14, dt);
    const w = curWeapon();
    const piv = s.root.position.clone(); piv.y += 1.62;
    const shoulder = piv.clone().addScaledVector(camRight, 0.55 * (1 - G.aimK));
    const D = lerp(3.3, -0.25, G.aimK);
    const want = shoulder.clone().addScaledVector(camDir, -D); want.y += 0.25 * (1 - G.aimK);
    // collision
    const dv = want.clone().sub(piv), L = dv.length();
    if (L > 0.01 && G.aimK < 0.9) { dv.divideScalar(L); const t = rayWorld(piv, dv, L + 0.3); if (t >= 0) want.copy(piv).addScaledVector(dv, Math.max(0.2, t - 0.3)); }
    camera.position.copy(want);
    camera.lookAt(want.clone().add(camDir));
    fov = lerp(70, w ? 70 / W[w.key].zoom : 55, G.aimK);
    s.root.visible = G.aimK < 0.6;
    if (s.sprinting) fov += 5;
  }
  // recoil
  if (G.recoil > 0) { s.pitch += G.recoil * dt * 25 * 0.0 + 0; camera.rotateX(G.recoil); G.recoil = damp(G.recoil, 0, 10, dt); }
  camera.fov = damp(camera.fov, fov, 12, dt); camera.updateProjectionMatrix();

  camera.getWorldDirection(camDir);
}

// ================= main loop =================
const clock = new THREE.Clock();
let menuT = 0;
function frame() {
  requestAnimationFrame(frame);

  G.time += G.state === 'menu' ? 0 : dt;
  grassTime.value += dt;
  waterNormal.offset.x += dt * 0.004; waterNormal.offset.y += dt * 0.0025;
  if (G.state === 'menu') {
    menuT += dt * 0.05;
    const r = 260; camera.position.set(Math.cos(menuT) * r, 120, Math.sin(menuT) * r); camera.lookAt(0, 10, 0); camera.fov = 60; camera.updateProjectionMatrix();
    planeMesh.visible = false; zoneWall.visible = false;
  } else {
    zoneWall.visible = true;
    // plane
    if (plane.t < plane.dur + 5) { plane.t += dt; plane.pos.lerpVectors(plane.a, plane.b, plane.t / plane.dur); planeMesh.position.copy(plane.pos); planeMesh.visible = true; planeMesh.rotation.z = Math.sin(G.time * 0.7) * 0.03; }
    else planeMesh.visible = false;
    if (player.state === 'plane' && plane.t >= plane.dur - 0.2) jumpOut();
    if (planeGain) planeGain.gain.setTargetAtTime(player.state === 'plane' ? 0.25 : planeMesh.visible ? 0.05 : 0, AC.currentTime, 0.3);
    updZone(dt);
    updPlayer(dt);
    for (const s of soldiers) if (!s.isPlayer) botUpdate(s, dt);
    // zone damage
    for (const s of soldiers) if (s.alive && s.state === 'ground' && outside(s)) damage(s, zone.dmg * dt, null, false, null);
    if (player.alive && player.state === 'ground' && outside(player) && Math.random() < dt * 1.5) beep(200, 0.05, 'sine', 0.04);
    updCamera(dt);

    for (const s of soldiers) { if (s.isPlayer || s.state === 'plane') continue; const d = s.root.position.distanceTo(camera.position); if (s.alive || s.deathT < 20) s.root.visible = d < 380; }
    updHud(dt);
    if (G.state !== 'menu') drawMap();
  }

  const focus = player.state === 'ground' || !player.alive ? player.root.position : camera.position;
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(sunDir, 150);
  if (player.state === 'ground' || player.state === 'chute' || G.state === 'menu') grass.update(player.state === 'chute' || player.state === 'ground' ? player.root.position.x : 0, player.state === 'chute' || player.state === 'ground' ? player.root.position.z : 0);

}
const drs = { t: 0, n: 0 };
drawMapBg();
$('mapWrap').style.backgroundImage = `url(${mapBg.toDataURL()})`;
resetGame(); G.state = 'menu';
for (const s of soldiers) s.root.visible = false;
setTimeout(() => { $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 400); }, 50);
frame();
window.__G = G; window.__player = player; window.__soldiers = soldiers; window.__jump = jumpOut;
</script>
