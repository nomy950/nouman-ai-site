<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#2ff3ff;--pink:#ff2bd6;--gold:#ffc94a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#05020c;font-family:'Orbitron',system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
  #app canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .5s}
  .hud.on{opacity:1}
  .tl{position:absolute;top:14px;left:16px}
  .tr{position:absolute;top:14px;right:16px;text-align:right}
  .lbl{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.55);font-weight:500}
  .val{font-size:26px;font-weight:900;letter-spacing:1px;text-shadow:0 0 12px var(--cyan),0 0 2px #fff}
  .val.small{font-size:16px;text-shadow:0 0 10px var(--pink)}
  .mult{font-size:12px;color:var(--gold);text-shadow:0 0 8px var(--gold);margin-top:2px;height:14px}
  .speedo{position:absolute;right:18px;bottom:20px;width:170px;height:120px}
  .speedo svg{position:absolute;inset:0}
  .spd{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:42px;font-weight:900;text-shadow:0 0 16px var(--cyan),0 0 3px #fff;letter-spacing:1px}
  .unit{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.6)}
  .nitrobar{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;width:min(46vw,260px);height:10px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(47,243,255,.35);overflow:hidden;box-shadow:0 0 14px rgba(47,243,255,.25)}
  .nitrobar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2b6bff,var(--cyan),#fff);box-shadow:0 0 12px var(--cyan);transform-origin:left;transition:transform .1s linear}
  .nlabel{position:absolute;left:50%;transform:translateX(-50%);bottom:38px;font-size:9px;letter-spacing:5px;color:rgba(47,243,255,.85)}
  #nitroBtn{position:fixed;left:18px;bottom:22px;width:84px;height:84px;border-radius:50%;z-index:6;display:none;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:2px;color:#fff;border:2px solid var(--cyan);background:radial-gradient(circle,rgba(47,243,255,.35),rgba(10,20,60,.35) 70%);box-shadow:0 0 22px rgba(47,243,255,.55),inset 0 0 18px rgba(47,243,255,.4);pointer-events:auto;touch-action:none}
  #nitroBtn.active{background:radial-gradient(circle,rgba(255,255,255,.7),rgba(47,243,255,.5) 60%);transform:scale(.94)}
  body.touch.playing #nitroBtn{display:flex}
  .hint{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:rgba(255,255,255,.12);font-weight:900;display:none}
  body.touch .hint{display:block}
  .hint.l{left:14px}.hint.r{right:14px}
  .pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-weight:900;font-size:22px;letter-spacing:3px;z-index:7;pointer-events:none;white-space:nowrap;animation:pop 1.1s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(5,2,12,0) 30%,rgba(5,2,12,.65) 100%)}
  .screen.hide{opacity:0;pointer-events:none}
  .title{font-size:clamp(44px,11vw,104px);font-weight:900;line-height:.92;letter-spacing:2px;background:linear-gradient(180deg,#fff 0%,#ffd3f6 30%,var(--pink) 62%,#7a2bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,43,214,.75)) drop-shadow(0 0 2px #fff)}
  .title span{display:block;font-size:.5em;letter-spacing:.42em;background:linear-gradient(180deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px rgba(47,243,255,.9));margin-top:6px;padding-left:.42em}
  .sub{margin-top:18px;font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.7)}
  .btn{margin-top:32px;pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:900;font-size:16px;letter-spacing:5px;color:#fff;padding:16px 38px;border-radius:40px;border:2px solid var(--cyan);background:rgba(47,243,255,.12);box-shadow:0 0 24px rgba(47,243,255,.6),inset 0 0 16px rgba(47,243,255,.35);animation:pulse 1.6s ease-in-out infinite}
  .btn:active{transform:scale(.96)}
  @keyframes pulse{50%{box-shadow:0 0 40px rgba(47,243,255,.9),inset 0 0 22px rgba(47,243,255,.5)}}
  .ctrl{margin-top:26px;font-size:10px;line-height:2;letter-spacing:2px;color:rgba(255,255,255,.55)}
  .ctrl b{color:var(--cyan);font-weight:700}
  .over-h{font-size:clamp(34px,9vw,70px);font-weight:900;color:#fff;text-shadow:0 0 24px var(--pink),0 0 4px #fff;letter-spacing:4px}
  .stats{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 34px}
  .stats .val{font-size:22px}
  .newbest{margin-top:14px;color:var(--gold);font-size:13px;letter-spacing:4px;text-shadow:0 0 12px var(--gold);height:16px}
  #mute{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:11;pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:inherit;font-size:9px;letter-spacing:3px;padding:6px 12px;border-radius:20px;cursor:pointer}
  .flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.0),rgba(255,60,120,.0));opacity:0;transition:opacity .4s}
  .flash.go{opacity:1;background:radial-gradient(circle,rgba(255,240,220,.85),rgba(255,40,90,.4));transition:none}
  #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#05020c;font-size:12px;letter-spacing:6px;color:var(--cyan);transition:opacity .6s}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<body>
<div id="app"></div>
<div class="flash" id="flash"></div>
<div id="loading">IGNITION…</div>

<div class="hud" id="hud">
  <div class="tl"><div class="lbl">SCORE</div><div class="val" id="score">0</div><div class="mult" id="mult"></div></div>
  <div class="tr"><div class="lbl">BEST</div><div class="val small" id="best">0</div><div class="lbl" style="margin-top:8px">DIST</div><div class="val small" id="dist">0.0 KM</div></div>
  <div class="hint l">‹</div><div class="hint r">›</div>
  <div class="nlabel">NITRO</div>
  <div class="nitrobar"><i id="nitroFill"></i></div>
  <div class="speedo">
    <svg viewBox="0 0 170 120">
      <defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#2ff3ff"/><stop offset=".7" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffc94a"/></linearGradient>
      <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <path d="M20 108 A68 68 0 1 1 150 108" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8" stroke-linecap="round"/>
      <path id="arc" d="M20 108 A68 68 0 1 1 150 108" fill="none" stroke="url(#sg)" stroke-width="8" stroke-linecap="round" filter="url(#gl)" stroke-dasharray="330" stroke-dashoffset="330"/>
    </svg>
    <div class="spd" id="spd">0</div><div class="unit">KM/H</div>
  </div>
</div>
<div id="nitroBtn">NITRO</div>

<div class="screen" id="menu">
  <div class="title">NEON<span>RIDER</span></div>
  <div class="sub">MIDNIGHT HIGHWAY · 2088</div>
  <button class="btn" id="startBtn">RIDE</button>
  <div class="ctrl" id="ctrlTxt"></div>
</div>
<div class="screen hide" id="over">
  <div class="over-h">WIPEOUT</div>
  <div class="stats">
    <div><div class="lbl">SCORE</div><div class="val" id="oScore">0</div></div>
    <div><div class="lbl">BEST</div><div class="val" id="oBest">0</div></div>
    <div><div class="lbl">DISTANCE</div><div class="val" id="oDist">0</div></div>
    <div><div class="lbl">TOP SPEED</div><div class="val" id="oTop">0</div></div>
  </div>
  <div class="newbest" id="newBest"></div>
  <button class="btn" id="againBtn">RIDE AGAIN</button>
</div>
<button id="mute">SOUND ON</button>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
document.getElementById('ctrlTxt').innerHTML = isTouch
  ? 'HOLD <b>LEFT / RIGHT</b> SIDE TO STEER<br>HOLD <b>NITRO</b> TO BOOST · DODGE TRAFFIC · GRAB ORBS'
  : '<b>← →</b> / <b>A D</b> STEER · <b>↑</b> THROTTLE · <b>↓</b> BRAKE<br><b>SPACE / SHIFT</b> NITRO · DODGE TRAFFIC · GRAB ORBS';

// ---------- seeded random ----------
let _seed = 1337;
const rnd = () => ((_seed = (_seed * 16807) % 2147483647) - 1) / 2147483646;
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio || 1, isTouch ? 1.5 : 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0x24093a);
scene.background = FOG.clone();
scene.fog = new THREE.FogExp2(FOG, 0.0062);

const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 2, 6);

// ---------- environment map (neon reflections) ----------
{
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h=normalize(vP).y; vec3 top=vec3(.03,.01,.09); vec3 hor=vec3(.55,.12,.45); vec3 bot=vec3(.02,.01,.03); vec3 c = h>0. ? mix(hor,top,pow(h,.5)) : mix(hor,bot,pow(-h,.35)); gl_FragColor=vec4(c,1.); }'
  }));
  es.add(sky);
  const strip = (col, x, y, z, w, h, d) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(6) })); m.position.set(x, y, z); es.add(m); };
  strip(0xff2bd6, -30, 6, 0, 1, 3, 80);
  strip(0x2ff3ff, 30, 4, 0, 1, 2, 80);
  strip(0xffb36b, 0, 30, -10, 30, 1, 2);
  strip(0x7a5bff, 0, 25, 20, 40, 1, 3);
  scene.environment = pm.fromScene(es, 0.03).texture;
  pm.dispose();
}

scene.add(new THREE.HemisphereLight(0x7a5cff, 0x1a0620, 0.55));
const moon = new THREE.DirectionalLight(0xb7a2ff, 0.6); moon.position.set(-30, 60, -40); scene.add(moon);

// ---------- helpers ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const glowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.55)');
  gr.addColorStop(.6, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}, false);
const additive = (opts = {}) => new THREE.MeshBasicMaterial(Object.assign({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: true, toneMapped: true }, opts));
const hdr = (hex, s) => new THREE.Color(hex).multiplyScalar(s);

const L = 600;               // world loop length
const wrapZ = v => (((v % L) + L) % L) - (L - 28);
const ROAD_W = 18, LANES = [-6.75, -2.25, 2.25, 6.75], EDGE = 7.7;

// ---------- road ----------
const TILE = 24;
const roadTex = canvasTex(512, 1024, (g, w, h) => {
  g.fillStyle = '#121019'; g.fillRect(0, 0, w, h);
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = Math.random() * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.2; }
  g.putImageData(img, 0, 0);
  // tire tracks
  for (const lx of LANES) { const px = (lx + 9) / 18 * w; g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(px - 26, 0, 14, h); g.fillRect(px + 12, 0, 14, h); }
  const X = x => (x + 9) / 18 * w;
  g.fillStyle = '#e8e6ff';
  for (const bx of [-4.5, 0, 4.5]) { g.fillRect(X(bx) - 3, 0, 6, h * 0.42); }
  g.fillStyle = '#ffffff'; g.fillRect(X(-8.6) - 4, 0, 8, h); g.fillRect(X(8.6) - 4, 0, 8, h);
});
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping; roadTex.repeat.set(1, L / TILE);
const roughTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = 'rgb(150,150,150)'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = R(15, 70);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(15,15,15,.95)'); gr.addColorStop(1, 'rgba(15,15,15,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r * 0.7, r * 1.6, 0, 0, Math.PI * 2); g.fill();
  }
}, false);
roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping; roughTex.repeat.set(1, L / TILE / 2);
const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughnessMap: roughTex, roughness: 0.85, metalness: 0.35, envMapIntensity: 1.25, color: 0xb8b4d0 });
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, L), roadMat);
road.rotation.x = -Math.PI / 2; road.position.z = -L / 2 + 28; scene.add(road);

// ground grid
const gridTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#fff'; g.lineWidth = 3; g.shadowColor = '#fff'; g.shadowBlur = 6;
  g.strokeRect(0, 0, w, h);
});
gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping; gridTex.repeat.set(140, L / 10);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x07040c, roughness: 0.6, metalness: 0.5, emissive: hdr(0xff2bd6, 0.6), emissiveMap: gridTex });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, L), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.set(0, -0.06, -L / 2 + 28); scene.add(ground);

// rails
{
  const mk = (col, y, x, s) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, L), new THREE.MeshBasicMaterial({ color: hdr(col, s) })); m.position.set(x, y, -L / 2 + 28); scene.add(m); };
  for (const s of [-1, 1]) { mk(0x2ff3ff, 0.95, s * 9.15, 4); mk(0xff2bd6, 0.4, s * 9.15, 3.5); }
  // road edge glow
  const eg = new THREE.Mesh(new THREE.PlaneGeometry(1.4, L), additive({ map: canvasTex(64, 8, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }, false), color: hdr(0x2ff3ff, 0.35) }));
  for (const s of [-1, 1]) { const e = eg.clone(); e.rotation.x = -Math.PI / 2; e.position.set(s * 9.0, 0.02, -L / 2 + 28); scene.add(e); }
}

// ---------- instanced scrollers ----------
const scrollers = [];
function scroller(geo, mat, items, colorFn) {
  const mesh = new THREE.InstancedMesh(geo, mat, items.length);
  mesh.frustumCulled = false;
  if (colorFn) items.forEach((it, i) => mesh.setColorAt(i, colorFn(it, i)));
  scene.add(mesh);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), e = new THREE.Euler();
  const sc = { mesh, items, update(travel) {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      p.set(it.x, it.y || 0, wrapZ(it.base + travel));
      e.set(0, it.ry || 0, 0); q.setFromEuler(e);
      s.set(it.sx ?? 1, it.sy ?? 1, it.sz ?? 1);
      m.compose(p, q, s); mesh.setMatrixAt(i, m);
    }
    mesh.instanceMatrix.needsUpdate = true;
  } };
  scrollers.push(sc); return sc;
}

// rail posts
{
  const items = [];
  for (const s of [-1, 1]) for (let z = 0; z < L; z += 5) items.push({ base: z, x: s * 9.15, y: 0.5 });
  scroller(new THREE.BoxGeometry(0.14, 1.0, 0.14), new THREE.MeshStandardMaterial({ color: 0x22202c, metalness: 0.9, roughness: 0.3 }), items);
}

// street lights
{
  const pole = new THREE.CylinderGeometry(0.1, 0.16, 9, 8); pole.translate(0, 4.5, 0);
  const arm = new THREE.BoxGeometry(2.4, 0.14, 0.14); arm.translate(1.2, 9, 0);
  const poleGeo = mergeGeometries([pole, arm]);
  const head = new THREE.BoxGeometry(1.3, 0.16, 0.45); head.translate(2.2, 8.86, 0);
  const pool = new THREE.PlaneGeometry(6, 18); pool.rotateX(-Math.PI / 2); pool.translate(2.2, 0.025, 2);
  const items = [];
  let k = 0;
  for (const s of [-1, 1]) for (let z = 0; z < L; z += 30) items.push({ base: z + (s > 0 ? 15 : 0), x: s * 10.4, ry: s < 0 ? 0 : Math.PI, warm: (k++ % 2) === 0 });
  scroller(poleGeo, new THREE.MeshStandardMaterial({ color: 0x1b1a22, metalness: 0.8, roughness: 0.35 }), items);
  scroller(head, new THREE.MeshBasicMaterial({ color: 0xffffff }), items, it => it.warm ? hdr(0xffb46a, 7) : hdr(0x8ff8ff, 7));
  scroller(pool, additive({ color: 0xffffff }), items, it => it.warm ? hdr(0xffa050, 0.18) : hdr(0x60f0ff, 0.15));
}

// neon arches
{
  const legL = new THREE.BoxGeometry(0.35, 9, 0.35); legL.translate(-10.2, 4.5, 0);
  const legR = legL.clone(); legR.translate(20.4, 0, 0);
  const top = new THREE.BoxGeometry(20.75, 0.35, 0.35); top.translate(0, 9, 0);
  const top2 = new THREE.BoxGeometry(20.75, 0.12, 0.12); top2.translate(0, 8.2, 0);
  const geo = mergeGeometries([legL, legR, top, top2]);
  const items = []; for (let z = 0; z < L; z += 100) items.push({ base: z + 40, x: 0 });
  scroller(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }), items, (it, i) => i % 2 ? hdr(0xff2bd6, 5) : hdr(0x2ff3ff, 5));
}

// buildings
function windowTex(cols, rows, tint) {
  return canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = '#06050b'; g.fillRect(0, 0, w, h);
    const cw = w / cols, rh = h / rows;
    const pals = [['#ffcf8a', '#ffe9c2', '#ffb35c'], ['#7ff6ff', '#c8fbff', '#3fb8ff'], ['#ff7ae6', '#ffc3f3', '#b77bff']];
    const pal = pals[tint];
    for (let r = 0; r < rows; r++) {
      const rowLit = Math.random() < 0.85;
      for (let c = 0; c < cols; c++) {
        const lit = rowLit && Math.random() < 0.42;
        g.fillStyle = lit ? pal[(Math.random() * 3) | 0] : (Math.random() < .5 ? '#14121f' : '#0c0b14');

const PN = 1400;
const pPos = new Float32Array(PN * 3), pCol = new Float32Array(PN * 4), pSize = new Float32Array(PN);
const pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN), pMax = new Float32Array(PN), pGrav = new Float32Array(PN), pWorld = new Uint8Array(PN), pBase = new Float32Array(PN * 3), pS0 = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('pcolor', new THREE.BufferAttribute(pCol, 4).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uPR: { value: PR } },
  vertexShader: `attribute float size; attribute vec4 pcolor; varying vec4 vC; uniform float uPR;
    void main(){ vC=pcolor; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=size*uPR*(320./-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `varying vec4 vC; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,0.,d); a*=a; gl_FragColor=vec4(vC.rgb, a*vC.a); }`
});
const particles = new THREE.Points(pGeo, pMat); particles.frustumCulled = false; scene.add(particles);
let pIdx = 0;
function emit(x, y, z, vx, vy, vz, life, size, r, g, b, grav = 0, world = 1) {
  const i = pIdx; pIdx = (pIdx + 1) % PN;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pLife[i] = pMax[i] = life; pS0[i] = size; pGrav[i] = grav; pWorld[i] = world;
  pBase[i * 3] = r; pBase[i * 3 + 1] = g; pBase[i * 3 + 2] = b;
}
function updateParticles(dt, worldSpeed) {
  for (let i = 0; i < PN; i++) {
    if (pPos[i * 3 + 2] > camera.position.z - 1.2) pLife[i] = 0;
    if (pLife[i] <= 0) { pSize[i] = 0; pCol[i * 4 + 3] = 0; continue; }
    pLife[i] -= dt;
    const t = Math.max(pLife[i], 0) / pMax[i];
    pVel[i * 3 + 1] -= pGrav[i] * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += (pVel[i * 3 + 2] + (pWorld[i] ? worldSpeed : 0)) * dt;
    if (pPos[i * 3 + 1] < 0.02 && pGrav[i] > 0) { pPos[i * 3 + 1] = 0.02; pVel[i * 3 + 1] *= -0.4; }
    pSize[i] = pS0[i] * (0.4 + 0.6 * t);
    pCol[i * 4] = pBase[i * 3]; pCol[i * 4 + 1] = pBase[i * 3 + 1]; pCol[i * 4 + 2] = pBase[i * 3 + 2]; pCol[i * 4 + 3] = t;
  }
  pGeo.attributes.position.needsUpdate = pGeo.attributes.pcolor.needsUpdate = pGeo.attributes.size.needsUpdate = true;
}

  }
  camera.lookAt(lookTarget);
  if (st.mode === 'play') camera.rotateZ(st.lean * 0.28);
  const sh = st.shake * st.shake * 0.25 + (st.nitroOn ? 0.018 : 0) + sf * 0.006;
  camera.position.x += R(-sh, sh); camera.position.y += R(-sh, sh);
  const fovT = st.mode === 'menu' ? 58 : 64 + sf * 18 + (st.nitroOn ? 12 : 0);
  fovCur = damp(fovCur, fovT, 3, dt);
  camera.fov = fovCur; camera.updateProjectionMatrix();
  sky.position.copy(camera.position);

  // ---- post fx
  fx.uniforms.uTime.value = st.time;
  fx.uniforms.uBlur.value = damp(fx.uniforms.uBlur.value, sf * 0.03 + (st.nitroOn ? 0.03 : 0) + st.shake * 0.05, 4, dt);
  fx.uniforms.uCA.value = 0.0015 + sf * 0.003 + (st.nitroOn ? 0.0025 : 0) + st.shake * 0.01;
  fx.uniforms.uFlash.value = Math.max(0, st.mode === 'crash' ? 0.6 - st.crashT * 1.5 : 0);
  bloom.strength = 0.75 + (st.nitroOn ? 0.3 : 0);

  // ---- HUD
  if (st.mode === 'play') {
    const kmh = Math.round(st.speed * 3.6);
    elSpd.textContent = kmh;
    elArc.style.strokeDashoffset = 330 - clamp(kmh / 400, 0, 1) * 330;
    elScore.textContent = Math.floor(st.score).toLocaleString();
    elDist.textContent = (st.dist / 1000).toFixed(1) + ' KM';
    elNitro.style.transform = `scaleX(${st.nitro})`;
    elMult.textContent = st.combo > 1 ? `x${st.combo} COMBO` : (st.nitroOn ? 'x2 NITRO' : '');
  }
  updateAudio(st);
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  composer.render();
  if (!loaded) { loaded = true; const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }
}
// fonts then signs
const fontReady = document.fonts ? Promise.race([document.fonts.load('900 64px Orbitron'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontReady.catch(() => { }).then(() => { buildSigns(); loop(); });
window.__state = state;
</script>
</body>
</html>
